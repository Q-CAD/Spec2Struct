run_name: dmx2_forward_spin_ft
save_dir: outputs
# Released EDOS 400-d forward model to warm-start from (section 3, Pretrained
# checkpoints). Point this at the run directory you downloaded. run_forward_finetune_spin.py grafts its head into the total half of
# a split head and zero-initialises the m half, and rebuilds prop_scaler as
# [released total stats(400) || dataset m stats(400)].
# The released lattice_scaler is reused unchanged.
pretrain_dir: outputs/260714_121340_dmx2_forward_ft

train:
  deterministic: True
  random_seed: 2024
  trainer:
    precision: 32
    max_epochs: 1000
    accumulate_grad_batches: 1
    num_sanity_val_steps: 2
    gradient_clip_val: 0.5
    gradient_clip_algorithm: value
    profiler: simple

  early_stopping:
    patience: 100000
    verbose: False

  model_checkpoints:
    save_top_k: 1
    verbose: False
    save_last: True   # resumability

logging:
  val_check_interval: 5

  wandb:
    project: spec2struct
    entity: null
    log_model: True
    mode: offline

  wandb_watch:
    log: all
    log_freq: 500

  lr_monitor:
    logging_interval: step
    log_momentum: False

diffusion:
  time_dim: 256
  latent_dim: 0
  timesteps: 1000
  time_independent: True   # clean structure -> DOS regressor (time embedding zeroed)

  model:
    hidden_dim: 512
    num_layers: 6
    max_atoms: 100
    act_fn: 'silu'
    dis_emb: sin
    num_freqs: 128
    edge_style: fc
    cutoff: 7.0
    max_neighbors: 20
    ln: True
    ip: True
    smooth: True
    pred_type: True
    pred_graph_level: False
    pred_node_level: True
    pred_dim: 800
    # Per-atom output is [total(400) || m(400)]. The m half is zero-initialised, so
    # the predicted m is zero at step 0 and the backbone is unchanged, while the m
    # head still receives gradient.
    node_out_split: True

  beta_scheduler:
    scheduler_mode: cosine

  sigma_scheduler:
    sigma_begin: 0.005
    sigma_end: 0.5

optim:
  optimizer: Adam
  params:
    lr: 0.0001          # reduced fine-tune LR (pretrain used 1e-3)
    betas: [0.9, 0.999]
    eps: 1e-8
    weight_decay: 0
  new_pathway_lr: 0.001  # higher LR for the zero-initialised m head (node_out_m)
  lr_scheduler:
    use_lr_scheduler: True
    scheduler: ReduceLROnPlateau
    monitor_metric: val_loss
    monitor_metric_mode: min
    params:
      factor: 0.6
      patience: 30
      min_lr: 1e-5

property: y
niggli: False
primitive: False
graph_method: crystalnn
preprocess_workers: 128
lattice_scale_method: scale_length
tolerance: 0.1

datamodule:
  datasets:
    train:
      name: DMX2 spin-DOS train
      dataset_path: data/dmx2_dos_spin/train.json
      targets_path: null
      save_path: data/dmx2_dos_spin/train_ori.pt
    val:
      name: DMX2 spin-DOS val
      dataset_path: data/dmx2_dos_spin/val.json
      targets_path: null
      save_path: data/dmx2_dos_spin/val_ori.pt
    test:
      name: DMX2 spin-DOS test
      dataset_path: data/dmx2_dos_spin/test.json
      targets_path: null
      save_path: data/dmx2_dos_spin/test_ori.pt

  batch_size:
    train: 32
    val: 16
    test: 16
