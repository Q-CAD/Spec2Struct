run_name: dmx2_forward_ft
save_dir: outputs
# Released DOSMatGen "DOS forward model" (400-d total, time-independent, non-CFG).
# Total-only fine-tune on DMX_DOS_new (data/dmx2_dos, frozen split dmx2_v1): the head
# dims match the released checkpoint exactly, so NO surgery — plain strict warm start
# via run_forward_finetune.py. Released prop/lattice scalers REUSED (not refit).
pretrain_dir: outputs/dos_forward_model

train:
  deterministic: True
  random_seed: 2024
  trainer:
    precision: 32
    max_epochs: 1000
    accumulate_grad_batches: 1
    num_sanity_val_steps: 2
    gradient_clip_val: 0.5
    gradient_clip_algorithm: value
    profiler: simple

  early_stopping:
    patience: 100000
    verbose: False

  model_checkpoints:
    save_top_k: 1
    verbose: False
    save_last: True   # resumability

logging:
  val_check_interval: 5

  wandb:
    project: spec2struct
    entity: null
    log_model: True
    mode: offline

  wandb_watch:
    log: all
    log_freq: 500

  lr_monitor:
    logging_interval: step
    log_momentum: False

diffusion:
  time_dim: 256
  latent_dim: 0
  timesteps: 1000
  time_independent: True   # clean structure -> DOS regressor (time embedding zeroed)

  model:
    hidden_dim: 512
    num_layers: 6
    max_atoms: 100
    act_fn: 'silu'
    dis_emb: sin
    num_freqs: 128
    edge_style: fc
    cutoff: 7.0
    max_neighbors: 20
    ln: True
    ip: True
    smooth: True
    pred_type: True
    pred_graph_level: False
    pred_node_level: True
    pred_dim: 400   # total-only; matches the released head, no node_out_split

  beta_scheduler:
    scheduler_mode: cosine

  sigma_scheduler:
    sigma_begin: 0.005
    sigma_end: 0.5

optim:
  optimizer: Adam
  params:
    lr: 0.0001          # reduced fine-tune LR (pretrain used 1e-3)
    betas: [0.9, 0.999]
    eps: 1e-8
    weight_decay: 0
  lr_scheduler:
    use_lr_scheduler: True
    scheduler: ReduceLROnPlateau
    monitor_metric: val_loss
    monitor_metric_mode: min
    params:
      factor: 0.6
      patience: 30
      min_lr: 1e-5

property: y
niggli: False
primitive: False
graph_method: crystalnn
preprocess_workers: 128
lattice_scale_method: scale_length
tolerance: 0.1

datamodule:
  datasets:
    train:
      name: DMX2 DOS train
      dataset_path: data/dmx2_dos/train.json
      targets_path: null
      save_path: data/dmx2_dos/train_ori.pt
    val:
      name: DMX2 DOS val
      dataset_path: data/dmx2_dos/val.json
      targets_path: null
      save_path: data/dmx2_dos/val_ori.pt
    test:
      name: DMX2 DOS test
      dataset_path: data/dmx2_dos/test.json
      targets_path: null
      save_path: data/dmx2_dos/test_ori.pt

  batch_size:
    train: 32
    val: 16
    test: 16
